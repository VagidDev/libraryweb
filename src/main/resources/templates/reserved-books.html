<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" href="../static/icons/favicon.ico">
    <title>Reserved books</title>
</head>
<body>
<header class="text-bg-dark" th:insert="~{fragments/header.html :: header}">
</header>
<div class="container mt-3">
    <div class="my-3 p-3 bg-body rounded shadow-sm">
        <h6 class="border-bottom pb-2 mb-0">Зарезервированные книги</h6>
        <div class="d-flex text-body-secondary pt-3" th:each="reservation : ${reservations}">
            <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"
                 xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32"
                 preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title>

                <rect th:if="${reservation.isExpired()}" width="100%" height="100%" fill="#FA3631"></rect>
                <rect th:unless="${reservation.isExpired()}" width="100%" height="100%" fill="#007bff"></rect>
            </svg>
            <div class="pb-3 mb-0 small lh-sm border-bottom w-100">
                <div class="d-flex justify-content-between">
                    <strong class="text-gray-dark"
                            th:text="${reservation.getUser().getName()} + ' ' + ${reservation.getUser().getSurname()}">Full
                        Name</strong>
                    <a th:href="'/reservation/reserved/' + ${reservation.getBook().getId()} + '/users/' + ${reservation.getUser().getUsername()}">Вернуть</a>
                </div>
                <span class="d-block fs-6 fst-italic"
                      th:text="${reservation.getBook().getAuthor()} + ': ' + ${reservation.getBook().getTitle()}"></span>
                <span class="d-block fw-semibold">Взято: <span class="text-decoration-underline"
                                                               th:text="${reservation.getSimpleDate()}"></span> Вернуть до: <span
                        class="text-decoration-underline" th:text="${reservation.getExpirationDate()}"></span></span>
            </div>
        </div>
        <h6 class="text-end pb-2 mb-0 mt-2">Легенда</h6>

        <small class="d-block text-end mt-2">
            <span class="book-legend">
                <span class="fw-medium mx-1">Книгу должны вернуть</span>
                <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"
                     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32"
                     preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title>

                    <rect width="100%" height="100%" fill="#FA3631"></rect>
                </svg>
            </span>
            <span class="book-legend">
                <span class="fw-medium mx-1">Книга еще в аренде</span>
                <svg class="bd-placeholder-img flex-shrink-0 me-2 rounded" width="32" height="32"
                     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: 32x32"
                     preserveAspectRatio="xMidYMid slice" focusable="false"><title>Placeholder</title>
                    <rect width="100%" height="100%" fill="#007bff"></rect>
                </svg>
            </span>
        </small>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
